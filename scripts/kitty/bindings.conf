# Append to ~/.config/kitty/kitty.conf.
# This assumes rift_spawn.py is at ~/.config/kitty/rift_spawn.py.
# No global remote-control or cloning permission is required.

map cmd+shift+t      kitten rift_spawn.py tab
map cmd+shift+enter  kitten rift_spawn.py split
# fzf picker for existing rift sessions (picked one opens in a new tab).
map cmd+shift+p      combine : send_text all \x15 : send_text all rift-pick\r

# Kitty 0.43+: save only rift-attached panes using Kitty's native session
# format, then browse and activate saved sessions.
map cmd+shift+s      save_as_session --save-only --use-foreground-process --match=cmdline:rift --base-dir ~/.local/state/rift/sessions
map cmd+shift+r      goto_session ~/.local/state/rift/sessions
